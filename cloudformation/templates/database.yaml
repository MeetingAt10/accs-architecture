AWSTemplateFormatVersion: "2010-09-09"
Description: ACCS application database (DynamoDB single table, see adr/0003-dynamodb-single-table.md)

Parameters:
  TableName:
    Type: String

Resources:
  # One table for every entity. Keys are generic strings so new entities need no schema change.
  #   PK / SK         primary item key, e.g. USER#<id> / PROFILE, REPORT#<id> / HISTORY#<at>#<id>
  #   GSI1PK / GSI1SK alternate lookups, e.g. EMAIL#<email> / USER, STUDENTID#<id> / USER
  #   GSI2PK / GSI2SK per-owner and per-status lists sorted by time, e.g. RECIPIENT#<id> / <at>
  #   expiresAt       TTL in epoch seconds (password reset codes, sessions)
  # Encrypted at rest with the AWS owned key (DynamoDB default, no KMS charges).
  Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref TableName
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: GSI1PK, AttributeType: S }
        - { AttributeName: GSI1SK, AttributeType: S }
        - { AttributeName: GSI2PK, AttributeType: S }
        - { AttributeName: GSI2SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - { AttributeName: GSI1PK, KeyType: HASH }
            - { AttributeName: GSI1SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        - IndexName: GSI2
          KeySchema:
            - { AttributeName: GSI2PK, KeyType: HASH }
            - { AttributeName: GSI2SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

Outputs:
  TableName:
    Value: !Ref Table
  TableArn:
    Value: !GetAtt Table.Arn
