AWSTemplateFormatVersion: "2010-09-09"
Description: ACCS application database, twelve DynamoDB domain tables (DOC006 data dictionary, see adr/0004-dynamodb-domain-tables.md)

Parameters:
  TablePrefix:
    Type: String
    Description: Physical table names are <TablePrefix><domain table>, e.g. accs-dev-ccs_identity

Resources:
  # One table per DOC006 domain. Every table uses generic string keys PK/SK and overloaded indexes
  # GSI1..GSIn (keys GSInPK/GSInSK, projection ALL); the item types and key patterns are in DOC006.
  # TTL is a table setting, so only the identity, notification, and assistant tables expire items.
  # All tables: on-demand, PITR, deletion protection, retained on stack delete, AWS owned key.

  # ccs_identity: Accounts, roles and permissions, profiles, directory, sessions, login attempts, reset codes, settings, UNIQUE reservations.
  IdentityTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub ${TablePrefix}ccs_identity
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: GSI1PK, AttributeType: S }
        - { AttributeName: GSI1SK, AttributeType: S }
        - { AttributeName: GSI2PK, AttributeType: S }
        - { AttributeName: GSI2SK, AttributeType: S }
        - { AttributeName: GSI3PK, AttributeType: S }
        - { AttributeName: GSI3SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - { AttributeName: GSI1PK, KeyType: HASH }
            - { AttributeName: GSI1SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        - IndexName: GSI2
          KeySchema:
            - { AttributeName: GSI2PK, KeyType: HASH }
            - { AttributeName: GSI2SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        - IndexName: GSI3
          KeySchema:
            - { AttributeName: GSI3PK, KeyType: HASH }
            - { AttributeName: GSI3SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      TimeToLiveSpecification:
        AttributeName: expires_epoch
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

