AWSTemplateFormatVersion: "2010-09-09"
Description: Private S3 bucket served through CloudFront (static site or SPA)

Parameters:
  SiteName:
    Type: String
  Spa:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: true serves /index.html for unknown paths (client-side routing); false serves /404.html

Conditions:
  IsSpa: !Equals [!Ref Spa, "true"]

Resources:
  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Maps /about and /about/ to /about/index.html (Next.js export with trailingSlash).
  # Next.js Open Graph images are extensionless files (/page/opengraph-image, optionally -<hash>) and are served as-is.
  IndexRewrite:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub ${AWS::StackName}-index
      AutoPublish: true
      FunctionConfig:
        Comment: Append index.html to directory paths
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var r = event.request;
          var last = r.uri.split('/').pop();
          if (r.uri.endsWith('/')) r.uri += 'index.html';
          else if (!last.includes('.') && !/^(opengraph|twitter)-image(-[a-z0-9]+)?$/.test(last)) r.uri += '/index.html';
          return r;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Ref SiteName
        Enabled: true
        HttpVersion: http2and3
        PriceClass: PriceClass_200
        DefaultRootObject: index.html
        Origins:
          - Id: s3
            DomainName: !GetAtt Bucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: s3
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt IndexRewrite.FunctionMetadata.FunctionARN
        # S3 returns 403 for missing keys when the bucket is private.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: !If [IsSpa, 200, 404]
            ResponsePagePath: !If [IsSpa, /index.html, /404.html]
          - ErrorCode: 404
            ResponseCode: !If [IsSpa, 200, 404]
            ResponsePagePath: !If [IsSpa, /index.html, /404.html]

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${Bucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}

Outputs:
  BucketName:
    Value: !Ref Bucket
  DistributionId:
    Value: !Ref Distribution
  Url:
    Value: !Sub https://${Distribution.DomainName}
