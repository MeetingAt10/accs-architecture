AWSTemplateFormatVersion: "2010-09-09"
Description: Private S3 bucket served through CloudFront (static site or SPA)

Parameters:
  SiteName:
    Type: String
  Spa:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: true serves /index.html for unknown paths (client-side routing); false serves /404.html
  DomainName:
    Type: String
    Default: ""
    Description: Custom hostname (for example forums.access-ccs.com); empty keeps only the CloudFront default hostname
  ExtraDomainName:
    Type: String
    Default: ""
    Description: Optional second hostname on the same distribution (for example www.access-ccs.com)
  CertificateArn:
    Type: String
    Default: ""
    Description: us-east-1 ACM certificate covering the hostnames; required when DomainName is set
  HostedZoneId:
    Type: String
    Default: ""
    Description: Route 53 hosted zone for the hostnames; required when DomainName is set

Conditions:
  IsSpa: !Equals [!Ref Spa, "true"]
  HasDomain: !Not [!Equals [!Ref DomainName, ""]]
  HasExtraDomain: !And [!Condition HasDomain, !Not [!Equals [!Ref ExtraDomainName, ""]]]

Resources:
  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Maps /about and /about/ to /about/index.html (Next.js export with trailingSlash).
  # Next.js Open Graph images are extensionless files (/page/opengraph-image, optionally -<hash>) and are served as-is.
  IndexRewrite:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub ${AWS::StackName}-index
      AutoPublish: true
      FunctionConfig:
        Comment: Append index.html to directory paths
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var r = event.request;
          var last = r.uri.split('/').pop();
          if (r.uri.endsWith('/')) r.uri += 'index.html';
          else if (!last.includes('.') && !/^(opengraph|twitter)-image(-[a-z0-9]+)?$/.test(last)) r.uri += '/index.html';
          return r;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Ref SiteName
        Enabled: true
        HttpVersion: http2and3
        PriceClass: PriceClass_200
        DefaultRootObject: index.html
        Aliases: !If
          - HasDomain
          - !If [HasExtraDomain, [!Ref DomainName, !Ref ExtraDomainName], [!Ref DomainName]]
          - !Ref AWS::NoValue
        ViewerCertificate: !If
          - HasDomain
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - !Ref AWS::NoValue
        Origins:
          - Id: s3
            DomainName: !GetAtt Bucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: s3
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt IndexRewrite.FunctionMetadata.FunctionARN
        # S3 returns 403 for missing keys when the bucket is private.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: !If [IsSpa, 200, 404]
            ResponsePagePath: !If [IsSpa, /index.html, /404.html]
          - ErrorCode: 404
            ResponseCode: !If [IsSpa, 200, 404]
            ResponsePagePath: !If [IsSpa, /index.html, /404.html]

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${Bucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  # CloudFront alias records; Z2FDTNDATAQYW2 is the fixed hosted zone ID for every CloudFront distribution.
  DnsRecords:
    Type: AWS::Route53::RecordSetGroup
    Condition: HasDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      RecordSets:
        - Name: !Ref DomainName
          Type: A
          AliasTarget: {DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2}
        - Name: !Ref DomainName
          Type: AAAA
          AliasTarget: {DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2}

  ExtraDnsRecords:
    Type: AWS::Route53::RecordSetGroup
    Condition: HasExtraDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      RecordSets:
        - Name: !Ref ExtraDomainName
          Type: A
          AliasTarget: {DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2}
        - Name: !Ref ExtraDomainName
          Type: AAAA
          AliasTarget: {DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2}

Outputs:
  BucketName:
    Value: !Ref Bucket
  DistributionId:
    Value: !Ref Distribution
  Url:
    Value: !If [HasDomain, !Sub "https://${DomainName}", !Sub "https://${Distribution.DomainName}"]
  # CloudFront default hostname; keeps working after a custom domain is added.
  DefaultUrl:
    Value: !Sub https://${Distribution.DomainName}
