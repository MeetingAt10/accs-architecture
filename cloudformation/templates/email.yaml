AWSTemplateFormatVersion: "2010-09-09"
Description: Amazon SES sending identity for the domain, with Easy DKIM records in Route 53 (issue 8). Deploy once per account and region as stack accs-email; accs-dev and accs-prod both send from it.

Parameters:
  Domain:
    Type: String
    Default: access-ccs.com
  HostedZoneId:
    Type: String
    Default: Z09799202NPP9TLA01MFH

Resources:
  Identity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Ref Domain

  # Easy DKIM: three CNAMEs. SES marks the domain verified once they resolve.
  Dkim1:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !GetAtt Identity.DkimDNSTokenName1
      Type: CNAME
      TTL: "1800"
      ResourceRecords: [!GetAtt Identity.DkimDNSTokenValue1]
  Dkim2:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !GetAtt Identity.DkimDNSTokenName2
      Type: CNAME
      TTL: "1800"
      ResourceRecords: [!GetAtt Identity.DkimDNSTokenValue2]
  Dkim3:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !GetAtt Identity.DkimDNSTokenName3
      Type: CNAME
      TTL: "1800"
      ResourceRecords: [!GetAtt Identity.DkimDNSTokenValue3]

Outputs:
  Identity:
    Value: !Ref Identity
