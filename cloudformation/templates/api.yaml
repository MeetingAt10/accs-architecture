AWSTemplateFormatVersion: "2010-09-09"
Description: accs-backend Express app on Lambda behind an API Gateway HTTP API

Parameters:
  CodeBucket:
    Type: String
  CodeKey:
    Type: String
  CorsOrigin:
    Type: String
  TableName:
    Type: String
  TableArn:
    Type: String

Resources:
  # Registered accounts and password hashes (one JSON object). Private, encrypted, versioned, kept on stack delete.
  AuthStoreBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30

  AuthStoreBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AuthStoreBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt AuthStoreBucket.Arn
              - !Sub ${AuthStoreBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: "false"

  Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: auth-store
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub ${AuthStoreBucket.Arn}/auth-store.json
              # ListBucket turns a missing object into 404 instead of 403.
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt AuthStoreBucket.Arn
        # Item-level access to the app table and its indexes. No Scan: every read goes through a key.
        - PolicyName: app-table
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:BatchGetItem
                  - dynamodb:Query
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:ConditionCheckItem
                Resource:
                  - !Ref TableArn
                  - !Sub ${TableArn}/index/*

  Function:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: index.handler
      MemorySize: 256
      Timeout: 10
      Role: !GetAtt Role.Arn
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      Environment:
        Variables:
          NODE_ENV: production
          CORS_ORIGIN: !Ref CorsOrigin
          AUTH_STORE_BUCKET: !Ref AuthStoreBucket
          TABLE_NAME: !Ref TableName

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${Function}
      RetentionInDays: 14

  # Quick create: Target adds a $default route and auto-deployed $default stage.
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub ${AWS::StackName}-http
      ProtocolType: HTTP
      Target: !GetAtt Function.Arn

  InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref Function
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*

Outputs:
  Url:
    Value: !GetAtt HttpApi.ApiEndpoint
  FunctionName:
    Value: !Ref Function
  AuthStoreBucket:
    Value: !Ref AuthStoreBucket
