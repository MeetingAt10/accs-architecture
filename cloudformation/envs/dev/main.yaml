AWSTemplateFormatVersion: "2010-09-09"
Description: accs environment root stack (accs-dev on the -dev hostnames and dev.<Domain>, accs-prod on the plain hostnames)

Parameters:
  Project:
    Type: String
    Default: accs
  Env:
    Type: String
    AllowedValues: [dev, prod]
    Default: dev
    Description: dev serves <site>-dev.<Domain> and the landing site on dev.<Domain>; prod serves <site>.<Domain> and the landing site on <Domain> and www.<Domain>
  HostSuffix:
    Type: String
    Default: "-dev"
    Description: Appended to each site label ("-dev" gives portal-dev.<Domain>); empty for prod
  DesignRefPattern:
    Type: String
    Default: refs/heads/master
    Description: Git ref of the design system repo allowed to publish this environment's design site (master for dev, refs/tags/v* for prod)
  ApiCodeBucket:
    Type: String
  ApiCodeKey:
    Type: String
  DesignSystemRepository:
    Type: String
    Default: MeetingAt10@343086680/meetingatten-design-system@1431974802
    Description: GitHub OIDC subject of the design system repo after "repo:" (immutable owner@id/name@id form; gh api repos/OWNER/REPO/actions/oidc/customization/sub)
  Domain:
    Type: String
    Default: access-ccs.com
    Description: Registered domain; each site gets a hostname under it
  HostedZoneId:
    Type: String
    Default: Z09799202NPP9TLA01MFH
  CertificateArn:
    Type: String
    Default: arn:aws:acm:us-east-1:128908383744:certificate/5269d843-185c-4a08-9800-cca434a5de5e
    Description: us-east-1 ACM certificate for the domain and *.domain (stack accs-dev-certificate)
  SeedPassword:
    Type: String
    NoEcho: true
    Default: ""
    Description: Sign-in password of the seeded accounts in this environment. Set once by hand per stack; later deploys keep it.
  GithubOidcProviderArn:
    Type: String
    Default: ""
    Description: Existing GitHub OIDC provider ARN in this account; empty creates one

Conditions:
  IsProd: !Equals [!Ref Env, prod]

Resources:
  # Four sites: landing, team, the portal (every signed-in module is a path on it) and the design system.
  # They are chained so that a fresh stack does not create several CloudFront functions at once, which
  # CloudFront rejects with "Rate exceeded".
  LandingSite:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ../../templates/static-site.yaml
      Parameters:
        DomainName: !If [IsProd, !Ref Domain, !Sub "dev.${Domain}"]
        ExtraDomainName: !If [IsProd, !Sub "www.${Domain}", ""]
        CertificateArn: !Ref CertificateArn
        HostedZoneId: !Ref HostedZoneId
        SiteName: !Sub ${Project}-landing

  MeetingSite:
    Type: AWS::CloudFormation::Stack
    DependsOn: LandingSite
    Properties:
      TemplateURL: ../../templates/static-site.yaml
      Parameters:
        DomainName: !Sub team${HostSuffix}.${Domain}
        CertificateArn: !Ref CertificateArn
        HostedZoneId: !Ref HostedZoneId
        SiteName: meeting-at-10-website

  AppSite:
    Type: AWS::CloudFormation::Stack
    DependsOn: MeetingSite
    Properties:
      TemplateURL: ../../templates/static-site.yaml
      Parameters:
        DomainName: !Sub portal${HostSuffix}.${Domain}
        CertificateArn: !Ref CertificateArn
        HostedZoneId: !Ref HostedZoneId
        SiteName: !Sub ${Project}-frontend
        Spa: "true"

  # Public design system showcase (built and uploaded by the design system repo's GitHub Actions).
  DesignSite:
    Type: AWS::CloudFormation::Stack
    DependsOn: AppSite
    Properties:
      TemplateURL: ../../templates/static-site.yaml
      Parameters:
        DomainName: !Sub design${HostSuffix}.${Domain}
        CertificateArn: !Ref CertificateArn
        HostedZoneId: !Ref HostedZoneId
        SiteName: !Sub ${Project}-design-system

  DesignDeployRole:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ../../templates/github-deploy-role.yaml
      Parameters:
        Repository: !Ref DesignSystemRepository
        RefPattern: !Ref DesignRefPattern
        BucketName: !GetAtt DesignSite.Outputs.BucketName
        DistributionId: !GetAtt DesignSite.Outputs.DistributionId
        OidcProviderArn: !Ref GithubOidcProviderArn

  Database:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ../../templates/database.yaml
      Parameters:
        TablePrefix: !Sub ${Project}-${Env}-

  Api:
    Type: AWS::CloudFormation::Stack
    # The Lambda's IAM policy names the tables by prefix, so create them first.
    DependsOn: Database
    Properties:
      TemplateURL: ../../templates/api.yaml
      Parameters:
        CodeBucket: !Ref ApiCodeBucket
        CodeKey: !Ref ApiCodeKey
        TablePrefix: !GetAtt Database.Outputs.TablePrefix
        SeedPassword: !Ref SeedPassword
        # Email from the SES domain identity (stack accs-email). Dev only for now: prod gets it when the team is ready.
        MailFrom: !If [IsProd, "", !Sub "no-reply@${Domain}"]
        MailDomain: !Ref Domain
        # The portal's custom hostname plus its CloudFront default, so both keep working.
        CorsOrigin: !Join
          - ","
          -
            - !GetAtt AppSite.Outputs.Url
            - !GetAtt AppSite.Outputs.DefaultUrl

Outputs:
  LandingUrl:
    Value: !GetAtt LandingSite.Outputs.Url
  LandingBucket:
    Value: !GetAtt LandingSite.Outputs.BucketName
  LandingDistributionId:
    Value: !GetAtt LandingSite.Outputs.DistributionId
  MeetingUrl:
    Value: !GetAtt MeetingSite.Outputs.Url
  MeetingBucket:
    Value: !GetAtt MeetingSite.Outputs.BucketName
  MeetingDistributionId:
    Value: !GetAtt MeetingSite.Outputs.DistributionId
  AppUrl:
    Value: !GetAtt AppSite.Outputs.Url
  AppBucket:
    Value: !GetAtt AppSite.Outputs.BucketName
  AppDistributionId:
    Value: !GetAtt AppSite.Outputs.DistributionId
  DesignUrl:
    Value: !GetAtt DesignSite.Outputs.Url
  DesignBucket:
    Value: !GetAtt DesignSite.Outputs.BucketName
  DesignDistributionId:
    Value: !GetAtt DesignSite.Outputs.DistributionId
  DesignDeployRoleArn:
    Value: !GetAtt DesignDeployRole.Outputs.RoleArn
  ApiUrl:
    Value: !GetAtt Api.Outputs.Url
  # Read by backend CI to update the Lambda code.
  ApiFunctionName:
    Value: !GetAtt Api.Outputs.FunctionName
  TablePrefix:
    Value: !GetAtt Database.Outputs.TablePrefix
