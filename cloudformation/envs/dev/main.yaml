AWSTemplateFormatVersion: "2010-09-09"
Description: accs dev environment root stack

Parameters:
  Project:
    Type: String
    Default: accs
  ApiCodeBucket:
    Type: String
  ApiCodeKey:
    Type: String
  DesignSystemRepository:
    Type: String
    Default: MeetingAt10/meetingatten-design-system
  GithubOidcProviderArn:
    Type: String
    Default: ""
    Description: Existing GitHub OIDC provider ARN in this account; empty creates one

Resources:
  LandingSite:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ../../templates/static-site.yaml
      Parameters:
        SiteName: !Sub ${Project}-landing

  MeetingSite:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ../../templates/static-site.yaml
      Parameters:
        SiteName: meeting-at-10-website

  AppSite:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ../../templates/static-site.yaml
      Parameters:
        SiteName: !Sub ${Project}-frontend
        Spa: "true"

  # Public design system showcase (built and uploaded by the design system repo's GitHub Actions).
  DesignSite:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ../../templates/static-site.yaml
      Parameters:
        SiteName: !Sub ${Project}-design-system

  DesignDeployRole:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ../../templates/github-deploy-role.yaml
      Parameters:
        Repository: !Ref DesignSystemRepository
        BucketName: !GetAtt DesignSite.Outputs.BucketName
        DistributionId: !GetAtt DesignSite.Outputs.DistributionId
        OidcProviderArn: !Ref GithubOidcProviderArn

  Api:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ../../templates/api.yaml
      Parameters:
        CodeBucket: !Ref ApiCodeBucket
        CodeKey: !Ref ApiCodeKey
        CorsOrigin: !GetAtt AppSite.Outputs.Url

Outputs:
  LandingUrl:
    Value: !GetAtt LandingSite.Outputs.Url
  LandingBucket:
    Value: !GetAtt LandingSite.Outputs.BucketName
  LandingDistributionId:
    Value: !GetAtt LandingSite.Outputs.DistributionId
  MeetingUrl:
    Value: !GetAtt MeetingSite.Outputs.Url
  MeetingBucket:
    Value: !GetAtt MeetingSite.Outputs.BucketName
  MeetingDistributionId:
    Value: !GetAtt MeetingSite.Outputs.DistributionId
  AppUrl:
    Value: !GetAtt AppSite.Outputs.Url
  AppBucket:
    Value: !GetAtt AppSite.Outputs.BucketName
  AppDistributionId:
    Value: !GetAtt AppSite.Outputs.DistributionId
  DesignUrl:
    Value: !GetAtt DesignSite.Outputs.Url
  DesignBucket:
    Value: !GetAtt DesignSite.Outputs.BucketName
  DesignDistributionId:
    Value: !GetAtt DesignSite.Outputs.DistributionId
  DesignDeployRoleArn:
    Value: !GetAtt DesignDeployRole.Outputs.RoleArn
  ApiUrl:
    Value: !GetAtt Api.Outputs.Url
