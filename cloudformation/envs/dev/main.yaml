AWSTemplateFormatVersion: "2010-09-09"
Description: accs dev environment root stack

Parameters:
  Project:
    Type: String
    Default: accs
  ApiCodeBucket:
    Type: String
  ApiCodeKey:
    Type: String
  DesignSystemRepository:
    Type: String
    Default: MeetingAt10@343086680/meetingatten-design-system@1431974802
    Description: GitHub OIDC subject of the design system repo after "repo:" (immutable owner@id/name@id form; gh api repos/OWNER/REPO/actions/oidc/customization/sub)
  GithubOidcProviderArn:
    Type: String
    Default: ""
    Description: Existing GitHub OIDC provider ARN in this account; empty creates one

Resources:
  LandingSite:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ../../templates/static-site.yaml
      Parameters:
        SiteName: !Sub ${Project}-landing

  MeetingSite:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ../../templates/static-site.yaml
      Parameters:
        SiteName: meeting-at-10-website

  AppSite:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ../../templates/static-site.yaml
      Parameters:
        SiteName: !Sub ${Project}-frontend
        Spa: "true"

  # AppSite is the portal; the module sites below serve the same SPA build on their own hosts.
  ForumsSite:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ../../templates/static-site.yaml
      Parameters:
        SiteName: !Sub ${Project}-forums
        Spa: "true"

  ScheduleSite:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ../../templates/static-site.yaml
      Parameters:
        SiteName: !Sub ${Project}-schedule
        Spa: "true"

  CasesSite:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ../../templates/static-site.yaml
      Parameters:
        SiteName: !Sub ${Project}-cases
        Spa: "true"

  EvaluationsSite:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ../../templates/static-site.yaml
      Parameters:
        SiteName: !Sub ${Project}-evaluations
        Spa: "true"

  RecordsSite:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ../../templates/static-site.yaml
      Parameters:
        SiteName: !Sub ${Project}-records
        Spa: "true"

  AdminSite:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ../../templates/static-site.yaml
      Parameters:
        SiteName: !Sub ${Project}-admin
        Spa: "true"

  # Public design system showcase (built and uploaded by the design system repo's GitHub Actions).
  DesignSite:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ../../templates/static-site.yaml
      Parameters:
        SiteName: !Sub ${Project}-design-system

  DesignDeployRole:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ../../templates/github-deploy-role.yaml
      Parameters:
        Repository: !Ref DesignSystemRepository
        BucketName: !GetAtt DesignSite.Outputs.BucketName
        DistributionId: !GetAtt DesignSite.Outputs.DistributionId
        OidcProviderArn: !Ref GithubOidcProviderArn

  Database:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ../../templates/database.yaml
      Parameters:
        TableName: !Sub ${Project}-dev-app

  Api:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ../../templates/api.yaml
      Parameters:
        CodeBucket: !Ref ApiCodeBucket
        CodeKey: !Ref ApiCodeKey
        TableName: !GetAtt Database.Outputs.TableName
        TableArn: !GetAtt Database.Outputs.TableArn
        CorsOrigin: !Join
          - ","
          -
            - !GetAtt AppSite.Outputs.Url
            - !GetAtt ForumsSite.Outputs.Url
            - !GetAtt ScheduleSite.Outputs.Url
            - !GetAtt CasesSite.Outputs.Url
            - !GetAtt EvaluationsSite.Outputs.Url
            - !GetAtt RecordsSite.Outputs.Url
            - !GetAtt AdminSite.Outputs.Url

Outputs:
  LandingUrl:
    Value: !GetAtt LandingSite.Outputs.Url
  LandingBucket:
    Value: !GetAtt LandingSite.Outputs.BucketName
  LandingDistributionId:
    Value: !GetAtt LandingSite.Outputs.DistributionId
  MeetingUrl:
    Value: !GetAtt MeetingSite.Outputs.Url
  MeetingBucket:
    Value: !GetAtt MeetingSite.Outputs.BucketName
  MeetingDistributionId:
    Value: !GetAtt MeetingSite.Outputs.DistributionId
  AppUrl:
    Value: !GetAtt AppSite.Outputs.Url
  AppBucket:
    Value: !GetAtt AppSite.Outputs.BucketName
  AppDistributionId:
    Value: !GetAtt AppSite.Outputs.DistributionId
  ForumsUrl:
    Value: !GetAtt ForumsSite.Outputs.Url
  ForumsBucket:
    Value: !GetAtt ForumsSite.Outputs.BucketName
  ForumsDistributionId:
    Value: !GetAtt ForumsSite.Outputs.DistributionId
  ScheduleUrl:
    Value: !GetAtt ScheduleSite.Outputs.Url
  ScheduleBucket:
    Value: !GetAtt ScheduleSite.Outputs.BucketName
  ScheduleDistributionId:
    Value: !GetAtt ScheduleSite.Outputs.DistributionId
  CasesUrl:
    Value: !GetAtt CasesSite.Outputs.Url
  CasesBucket:
    Value: !GetAtt CasesSite.Outputs.BucketName
  CasesDistributionId:
    Value: !GetAtt CasesSite.Outputs.DistributionId
  EvaluationsUrl:
    Value: !GetAtt EvaluationsSite.Outputs.Url
  EvaluationsBucket:
    Value: !GetAtt EvaluationsSite.Outputs.BucketName
  EvaluationsDistributionId:
    Value: !GetAtt EvaluationsSite.Outputs.DistributionId
  RecordsUrl:
    Value: !GetAtt RecordsSite.Outputs.Url
  RecordsBucket:
    Value: !GetAtt RecordsSite.Outputs.BucketName
  RecordsDistributionId:
    Value: !GetAtt RecordsSite.Outputs.DistributionId
  AdminUrl:
    Value: !GetAtt AdminSite.Outputs.Url
  AdminBucket:
    Value: !GetAtt AdminSite.Outputs.BucketName
  AdminDistributionId:
    Value: !GetAtt AdminSite.Outputs.DistributionId
  DesignUrl:
    Value: !GetAtt DesignSite.Outputs.Url
  DesignBucket:
    Value: !GetAtt DesignSite.Outputs.BucketName
  DesignDistributionId:
    Value: !GetAtt DesignSite.Outputs.DistributionId
  DesignDeployRoleArn:
    Value: !GetAtt DesignDeployRole.Outputs.RoleArn
  ApiUrl:
    Value: !GetAtt Api.Outputs.Url
  TableName:
    Value: !GetAtt Database.Outputs.TableName
  # JSON map of site key to URL, read by the frontend build (VITE_SITE_ORIGINS).
  SiteOrigins:
    Value: !Sub
      - '{"portal":"${Portal}","forums":"${Forums}","schedule":"${Schedule}","cases":"${Cases}","evaluations":"${Evaluations}","records":"${Records}","admin":"${Admin}"}'
      - Portal: !GetAtt AppSite.Outputs.Url
        Forums: !GetAtt ForumsSite.Outputs.Url
        Schedule: !GetAtt ScheduleSite.Outputs.Url
        Cases: !GetAtt CasesSite.Outputs.Url
        Evaluations: !GetAtt EvaluationsSite.Outputs.Url
        Records: !GetAtt RecordsSite.Outputs.Url
        Admin: !GetAtt AdminSite.Outputs.Url
